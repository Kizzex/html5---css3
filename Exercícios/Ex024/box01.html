<!DOCTYPE html>
<html lang="pt-be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: bisque;
            width: 300px;
            height: 300px;
           
            border: 5px solid black;
          
            padding: 20px 20px 20px 20px;
           
            margin: 20px auto 20px auto;
           
            outline: 5px dashed darkred;
        }

        a {
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>Parágrafos também são exemplos de box-levels, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona </p>
</body>
</html>
