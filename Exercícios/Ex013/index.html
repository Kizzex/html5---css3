<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexível">
    </picture>

    <h1>Reprodução de Áudio</h1>
    <p>Vamos reproduzir um áudio em HTML5.</p>
    <audio preload="metadata" controls>
        <source src="midia/left-u-into.mp3" type="audio/mpeg">
        <source src="midia/left-u-into.ogg" type="audio/ogg">
    <p>Infelizmente, seu navegador não suporta a reprodução de áudio.</p><a href="midia/left-u-into.mp3" download>Baixar Áudio.MP3</a>
    </audio>
</body>
</html>
