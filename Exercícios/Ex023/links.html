<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color:blueviolet;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkviolet;
        }

        a:hover {
            color: darkmagenta;
            text-decoration: underline;
        }

        a:active {
            color: purple;
        }

        .importante::before {
            content: "[importante]";
            text-decoration: none;
            font-weight: normal;
        }

        .importante::after {
            content: "[link]";
           text-decoration: none;
         font-weight: normal;
        }
    </style>
</head>
<body>
   <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/JackKizzex?tab=repositories" target="_blank">Repositório do GitHub</a></li>
        <li><a href="https://www.youtube.com/@ColdKizz-q3t" target="_blank">Canal do YouTube</a></li>
        <li><a href="https://www.instagram.com/kizze.x/" class="importante" target="_blank">Instagram oficial</a></li>
    </ul>
    
</body>
</html>
